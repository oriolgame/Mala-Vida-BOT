# Comprobación temporal de BSKT Stats en Netlify (solo en la rama de trabajo)
name: Comprobar Netlify
on:
  push:
    branches: ['claude/ecstatic-mccarthy-xfz3zj']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://bskt-stats.netlify.app
          echo "===== estructura team-stats 88829/2026"
          curl -sS -m 30 "$B/fcbq/team-stats/team/88829/season/2026" -o t.json
          python3 - <<'PY'
          import json
          d=json.load(open('t.json'))
          def show(n,p='',depth=0):
              if depth>3: return
              if isinstance(n,dict):
                  for k,v in n.items():
                      if isinstance(v,(dict,list)): print(p+k, type(v).__name__, len(v)); show(v,p+'  ',depth+1)
              elif isinstance(n,list) and n:
                  print(p+'[0] keys:', list(n[0].keys()) if isinstance(n[0],dict) else n[0]); show(n[0],p+'  ',depth+1)
          show(d)
          PY
          echo "===== contexto en el JS público"
          curl -sS -m 60 "https://totbasquet.basquetcatala.cat/main.js?v=20012027" -o main.js
          for k in 'team-stats' 'head-to-head/past-games' 'match-day-between' 'getByTeamAllSeason' 'getMatchClubMonth' 'federated/'; do
            echo "--- $k"; grep -o ".\{400\}$k.\{300\}" main.js | head -3
          done
