# Comprobación temporal de BSKT Stats en Netlify (solo en la rama de trabajo)
name: Comprobar Netlify
on:
  push:
    branches: ['claude/ecstatic-mccarthy-xfz3zj']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://bskt-stats.netlify.app/fcbq
          for M in 6ab81f29bcc75a0001ce24fa 2b5cd3f4-2158-4ada-a4d6-ec5bbbc4080f; do
            for p in "getJsonWithMatchMoves/$M" "getJsonWithMatchMoves/$M?currentSeason=false" "getJsonWithMatchStats/$M" \
                     "getJsonWithMatchMovesJwt/$M?currentSeason=true" "getJsonWithMatchStatsWithJwt/$M?currentSeason=true"; do
              printf "%-80s " "$p"; curl -sS -m 30 -o r.txt -w "%{http_code} " "$B/$p"; head -c 200 r.txt; echo
            done
          done
