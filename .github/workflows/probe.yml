# Comprobación temporal de la web en Netlify (solo en la rama de trabajo)
name: Comprobar Netlify
on:
  push:
    branches: ['claude/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 60
      - run: |
          B=https://bskt-stats.netlify.app
          for p in "/" "/contador/" "/fcbq.js" "/api/partidos" \
                   "/fcbq/getJsonWithMatchMoves/2b5cd3f4-2158-4ada-a4d6-ec5bbbc4080f?currentSeason=true" \
                   "/fcbq/getJsonWithMatchStats/2b5cd3f4-2158-4ada-a4d6-ec5bbbc4080f?currentSeason=true"; do
            echo "===== $p"
            curl -sS -m 30 -D - "$B$p" -o body.txt | grep -iE "^HTTP|content-type|x-nf|server:" || true
            head -c 1500 body.txt; echo
          done
