# Comprobación temporal de BSKT Stats en Netlify (solo en la rama de trabajo)
name: Comprobar Netlify
on:
  push:
    branches: ['claude/ecstatic-mccarthy-xfz3zj']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://bskt-stats.netlify.app
          for p in "player-stats/federated/fbfcb946-98d0-11e9-a2a5-0216824770c2/team/88829" \
                   "team-stats/team/88829/season/2026/playas/lo" "team-stats/team/88829/season/2026/playas/vs"; do
            echo "===== $p"
            curl -sS -m 30 "$B/fcbq/$p" -o r.json; wc -c < r.json
            python3 - <<'PY'
          import json,re
          t=open('r.json').read()
          try: d=json.loads(t)
          except Exception: print(t[:500]); raise SystemExit
          def show(n,p='',depth=0):
              if depth>4: return
              if isinstance(n,dict):
                  for k,v in n.items():
                      if isinstance(v,(dict,list)): print(p+k, type(v).__name__, len(v)); show(v,p+'  ',depth+1)
                      elif depth<2: print(p+k,'=',str(v)[:80])
              elif isinstance(n,list) and n:
                  print(p+'[0] =', json.dumps(n[0],ensure_ascii=False)[:1500]); show(n[0],p+'  ',depth+1)
          show(d)
          print('ids 24hex/uuid:', sorted(set(re.findall(r'[0-9a-f]{24}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}',t)))[:20])
          PY
          done
