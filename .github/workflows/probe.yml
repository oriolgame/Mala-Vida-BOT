# Comprobación temporal de BSKT Stats en Netlify (solo en la rama de trabajo)
name: Comprobar Netlify
on:
  push:
    branches: ['claude/ecstatic-mccarthy-xfz3zj']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 75
      - run: |
          B=https://bskt-stats.netlify.app
          L=$(curl -sS -m 30 "$B/api/partidos"); echo "lista: $L"
          echo "$L" | grep -q 88829 || curl -sS -m 30 -X POST -H 'content-type: application/json' -d '{"enlace":"https://www.basquetcatala.cat/equip/88829"}' "$B/api/partidos"; echo
          echo "lista: $(curl -sS -m 30 "$B/api/partidos")"
      - run: |
          npm i --no-save playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 420, height: 900 } });
          p.on('pageerror', (e) => console.log('ERR', e.message));
          await p.goto('https://bskt-stats.netlify.app/', { waitUntil: 'networkidle' }); await p.waitForTimeout(6000);
          const abrir = await p.$('[data-abrir]'); if (abrir) { await abrir.click(); await p.waitForTimeout(500); }
          console.log((await p.innerText('main')).replace(/\n{2,}/g, '\n'));
          await p.screenshot({ path: 'web.png', fullPage: true });
          await b.close();
          JS
          node shot.mjs
      - uses: actions/upload-artifact@v4
        with: { name: captura, path: web.png }
