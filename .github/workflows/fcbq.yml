name: Estadísticas FCBQ

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos (GitHub puede retrasarlo algunos minutos)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
    inputs:
      explorar:
        description: 'URLs a inspeccionar (separadas por espacios), solo para depurar'
        required: false
        default: ''
  push:
    paths: ['basquet/**', 'scripts/fcbq-update.mjs', '.github/workflows/fcbq.yml', 'index.html']

permissions:
  contents: write

concurrency:
  group: fcbq
  cancel-in-progress: false

jobs:
  update:
    # Solo en la rama principal del repositorio
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Explorar URLs
        if: ${{ github.event.inputs.explorar != '' }}
        run: node scripts/fcbq-update.mjs --explorar ${{ github.event.inputs.explorar }}

      - name: Descargar jugada a jugada y calcular estadísticas
        run: node scripts/fcbq-update.mjs

      - name: Guardar cambios
        run: |
          git config user.name "fcbq-bot"
          git config user.email "fcbq-bot@users.noreply.github.com"
          git add basquet/data/partidos.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar estadísticas FCBQ"
            git pull --rebase
            git push
          fi

      - name: Publicar web (rama gh-pages)
        run: |
          rm -rf /tmp/site && mkdir /tmp/site
          cp -r index.html basquet /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "fcbq-bot"
          git config user.email "fcbq-bot@users.noreply.github.com"
          git add -A && git commit -qm "Publicar web"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
