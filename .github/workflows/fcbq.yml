name: Estadísticas FCBQ

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos (GitHub puede retrasarlo algunos minutos)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main, master]
    paths: ['basquet/**', 'scripts/fcbq-update.mjs', '.github/workflows/fcbq.yml', 'index.html']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fcbq
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar jugada a jugada y calcular estadísticas
        run: node scripts/fcbq-update.mjs

      - name: Guardar cambios
        run: |
          git config user.name "fcbq-bot"
          git config user.email "fcbq-bot@users.noreply.github.com"
          git add basquet/data/partidos.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar estadísticas FCBQ"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
