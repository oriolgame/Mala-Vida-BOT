name: BSKT Stats

on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 minutos (GitHub puede retrasarlo algunos minutos)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
    inputs:
      explorar:
        description: 'URLs a inspeccionar (separadas por espacios), solo para depurar'
        required: false
        default: ''
  issues:
    types: [opened]           # botones "Añadir / Quitar partido" de la web
  push:
    paths: ['basquet/**', 'scripts/fcbq-update.mjs', '.github/workflows/fcbq.yml', 'index.html']

permissions:
  contents: write
  issues: write

concurrency:
  group: fcbq-${{ github.ref }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  update:
    # Solo aceptamos issues del propietario / colaboradores del repo
    if: github.event_name != 'issues' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    env:
      # Solo la rama principal actualiza datos y publica la web
      PRINCIPAL: ${{ github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Explorar URLs (depuración)
        if: ${{ github.event.inputs.explorar != '' || hashFiles('basquet/explorar.txt') != '' }}
        env:
          EXPLORAR: ${{ github.event.inputs.explorar }}
        run: |
          npm i --no-save playwright@1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node scripts/fcbq-explorar.mjs $EXPLORAR $(cat basquet/explorar.txt 2>/dev/null)

      - name: Añadir / quitar partido (issue)
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/fcbq-update.mjs --issue

      - name: Descargar jugada a jugada y calcular estadísticas
        if: env.PRINCIPAL == 'true'
        run: node scripts/fcbq-update.mjs

      - name: Guardar cambios
        if: env.PRINCIPAL == 'true'
        run: |
          git config user.name "fcbq-bot"
          git config user.email "fcbq-bot@users.noreply.github.com"
          git add basquet/data/partidos.json basquet/config.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar estadísticas FCBQ"
            git pull --rebase
            git push
          fi

      - name: Publicar web (rama gh-pages)
        if: env.PRINCIPAL == 'true'
        run: |
          # BSKT Stats en la raíz de la web; el contador de personas en /contador/
          rm -rf /tmp/site && mkdir -p /tmp/site/contador
          cp -r basquet/. /tmp/site/
          rm -f /tmp/site/config.json /tmp/site/README.md
          cp index.html /tmp/site/contador/index.html
          # enlaces antiguos /basquet/ siguen funcionando
          mkdir -p /tmp/site/basquet && echo '<meta http-equiv="refresh" content="0; url=../">' > /tmp/site/basquet/index.html
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "fcbq-bot"
          git config user.email "fcbq-bot@users.noreply.github.com"
          git add -A && git commit -qm "Publicar web"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Responder y cerrar la issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(cat basquet/data/respuesta.md 2>/dev/null || echo "❌ Algo ha fallado, revisa la pestaña Actions.")
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$MSG

          La web se actualizará en 1-2 minutos."
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
