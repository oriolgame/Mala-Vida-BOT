<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BSKT Stats</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>" />
  <style>
    :root { --bg:#0f0f13; --card:#1a1a22; --line:#2a2a36; --text:#e8e8f0; --muted:#8a8a9a; --accent:#ff7a1a; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px 16px 40px; }
    main { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    header h1 { font-size: 1.6rem; } header h1 span { color: var(--accent); }
    header p { color: var(--muted); font-size: .85rem; margin-top: 4px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    button, select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    button.on { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
    select { width: 100%; }
    .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; text-align: center; }
    .score .n { font-size: 2.6rem; font-weight: 800; }
    .score .t { font-size: .95rem; color: var(--muted); }
    .score .vs { color: var(--muted); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 14px; }
    .kpi { background: var(--bg); border-radius: 10px; padding: 10px; text-align: center; }
    .kpi b { display: block; font-size: 1.3rem; } .kpi small { color: var(--muted); font-size: .75rem; }
    h2 { font-size: 1.05rem; margin-bottom: 10px; }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; white-space: nowrap; }
    th, td { padding: 7px 8px; text-align: right; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; }
    th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
    tr.tot td { font-weight: 700; border-top: 2px solid var(--line); }
    td.pts { color: var(--accent); font-weight: 700; }
    .f5 { color: #ff5c5c; font-weight: 700; }
    .add { display: flex; gap: 8px; }
    .add input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    .add button { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 700; white-space: nowrap; }
    .hint { color: var(--muted); font-size: .8rem; margin-top: 8px; line-height: 1.5; }
    .hint.err { color: #ff5c5c; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row select { flex: 1; min-width: 0; }
    .btn-del { color: var(--muted); padding: 8px 10px; }
    .pend { color: var(--muted); text-align: center; padding: 18px 8px; line-height: 1.6; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chips:empty { display: none; }
    .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: .82rem; }
    .chip small { color: var(--muted); }
    .chip button { border: 0; background: none; padding: 2px 6px; color: var(--muted); }
    button.partido { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 0; background: none; padding: 0; text-align: left; }
    button.partido small { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
    button.partido .pts { color: var(--accent); font-weight: 700; white-space: nowrap; }
    .empty { color: var(--muted); text-align: center; padding: 30px 10px; line-height: 1.6; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>🏀 BSKT <span>Stats</span></h1>
    <p id="upd">Cargando…</p>
  </header>

  <div class="tabs" id="modes">
    <button data-m="equipo">Mi equipo</button>
    <button data-m="partido" class="on">Por partido</button>
    <button data-m="temporada">Temporada (acumulado)</button>
  </div>

  <div class="card">
    <form class="add" id="addForm">
      <input id="addUrl" placeholder="Enlace de un partido o de un equipo" autocomplete="off" />
      <button type="submit">＋ Añadir</button>
    </form>
    <p class="hint" id="addHint">Copia de basquetcatala.cat el enlace de un <b>partido</b> (…/estadistica/partit/…) o de un <b>equipo</b> (…/equip/…) y pégalo aquí.</p>
    <div class="chips" id="equipos"></div>
  </div>

  <div id="app"></div>
</main>

<script type="module">
import { buildMatch, idsIn, temporadaActual } from './fcbq.js';

const COLS = [
  ['dorsal', '#'], ['nombre', 'Jugador'], ['pj', 'PJ'], ['puntos', 'PTS'],
  ['t2', 'T2'], ['t3', 'Triples'], ['t1', 'TL'], ['faltas', 'Faltas'],
  ['rebotes', 'REB'], ['asistencias', 'AST'], ['robos', 'ROB'], ['perdidas', 'PER'], ['tapones', 'TAP'],
  ['min', 'Min'], ['val', 'Val'],
];
const OPCIONALES = ['rebotes','asistencias','robos','perdidas','tapones','min','val'];
const SUM = ['puntos','t1','t1i','t2','t2i','t3','t3i','faltas','tecnicas','antideportivas','faltasRecibidas','rebotes','asistencias','robos','perdidas','tapones'];
let data = null, mode = 'partido', matchIdx = 0, teamIdx = 0, sortKey = 'puntos', sortDir = -1;
const app = document.getElementById('app');
let lista = { partidos: [], equipos: [] };
const equipos = {};          // id de equipo → datos de la FCBQ (temporada + partidos jugados)
let equipoSel = 0, partidoAbierto = null;
const cache = {};            // id → partido calculado (se reutiliza entre refrescos)
const estadoEquipo = {};     // id de equipo → nº de partidos encontrados
const hint = document.getElementById('addHint');
const say = (html, err) => { hint.className = err ? 'hint err' : 'hint'; hint.innerHTML = html; };

// API propia (Netlify Function). Si hay PIN configurado, se pide una vez y se recuerda.
async function api(method, { body, qs = '' } = {}) {
  let pin = '';
  try { pin = localStorage.getItem('bskt-pin') || ''; } catch {}
  const r = await fetch('/api/partidos' + qs, { method, headers: { 'content-type': 'application/json', 'x-pin': pin }, body: body && JSON.stringify(body) });
  if (r.status === 401) {
    const nuevo = prompt('Introduce el PIN para editar la lista:');
    if (!nuevo) throw new Error('Hace falta el PIN para editar.');
    try { localStorage.setItem('bskt-pin', nuevo); } catch {}
    return api(method, { body, qs });
  }
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Error ' + r.status);
  return d;
}

document.getElementById('addForm').onsubmit = async (ev) => {
  ev.preventDefault();
  const input = document.getElementById('addUrl');
  const enlace = input.value.trim();
  if (!enlace) return;
  say('Añadiendo…');
  try {
    const d = await api('POST', { body: { enlace } });
    lista = d.lista;
    input.value = '';
    if (d.tipo === 'equipo') say(d.nuevos.length ? '✅ Equipo añadido. Buscando sus partidos…' : 'Ese equipo ya lo sigues 👍');
    else say(d.nuevos.length ? '✅ Partido añadido.' : 'Ese partido ya estaba en la lista 👍');
    if (d.nuevos.length && d.tipo === 'partido') matchIdx = 0;
    await refresh();
    if (d.tipo === 'equipo') { mode = 'equipo'; equipoSel = lista.equipos.findIndex((e) => e.id === (d.nuevos[0] || '')); if (equipoSel < 0) equipoSel = 0; render(); }
    if (d.tipo === 'equipo' && d.nuevos.length) {
      const n = estadoEquipo[d.nuevos[0]] || 0;
      say(n ? `✅ Equipo añadido: ${n} partidos jugados. Se actualiza solo.` : '✅ Equipo añadido. Aún no tiene partidos con estadísticas; aparecerán solos.');
    }
  } catch (e) { say(esc(e.message), true); }
};

async function quitar(id, que) {
  if (!confirm(`¿Quitar este ${que}?`)) return;
  try { lista = (await api('DELETE', { qs: '?id=' + encodeURIComponent(id) })).lista; matchIdx = 0; await refresh(); }
  catch (e) { say(esc(e.message), true); }
}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function cell(p, k) {
  // Sin intentos conocidos (la FCBQ no registra los fallos de 2 y 3) se muestran solo las anotadas
  if (k === 't1' || k === 't2' || k === 't3') return p[k + 'i'] == null ? p[k] : p[k + 'i'] ? `${p[k]}/${p[k + 'i']}` : '0';
  if (k === 'faltas') return p.faltas >= 5 ? `<span class="f5">${p.faltas}</span>` : p.faltas;
  return esc(p[k] ?? '');
}

function table(rows, total, showPJ) {
  const cols = COLS.filter(([k]) => (k !== 'pj' || showPJ) &&
    (!OPCIONALES.includes(k) || rows.some((r) => r[k])));
  rows = [...rows].sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    return (typeof x === 'number' ? (x - y) : String(x).localeCompare(String(y), 'es', { numeric: true })) * sortDir;
  });
  return `<div class="scroll"><table><thead><tr>${cols.map(([k, l]) => `<th data-k="${k}">${l}${sortKey === k ? (sortDir < 0 ? ' ▾' : ' ▴') : ''}</th>`).join('')}</tr></thead><tbody>
    ${rows.map((p) => `<tr>${cols.map(([k]) => `<td class="${k === 'puntos' ? 'pts' : ''}">${cell(p, k)}</td>`).join('')}</tr>`).join('')}
    ${total ? `<tr class="tot">${cols.map(([k], i) => `<td>${i === 1 ? 'Equipo' : i === 0 || k === 'pj' ? '' : cell(total, k)}</td>`).join('')}</tr>` : ''}
  </tbody></table></div>`;
}

function kpis(t) {
  const pct = (a, b) => (b ? Math.round((100 * a) / b) + '%' : '–');
  const et = (nombre, a, b) => (b == null ? nombre : `${nombre} (${pct(a, b)})`);
  return `<div class="kpis">
    <div class="kpi"><b>${t.puntos}</b><small>Puntos</small></div>
    <div class="kpi"><b>${t.t3}</b><small>${et('Triples', t.t3, t.t3i)}</small></div>
    <div class="kpi"><b>${t.t2}</b><small>${et('Canastas de 2', t.t2, t.t2i)}</small></div>
    <div class="kpi"><b>${t.t1}/${t.t1i}</b><small>Tiros libres (${pct(t.t1, t.t1i)})</small></div>
    <div class="kpi"><b>${t.faltas}</b><small>Faltas</small></div>
  </div>`;
}

function teamTabs(names) {
  return `<div class="tabs" id="teams" style="margin-bottom:12px">${names.map((n, i) => `<button data-t="${i}" class="${i === teamIdx ? 'on' : ''}">${esc(n)}</button>`).join('')}</div>`;
}

function renderMatch() {
  const ps = data.partidos;
  const m = ps[matchIdx];
  const [a, b] = m.equipos;
  const e = m.equipos[teamIdx] || a;
  const label = (p) => p.equipos.length ? p.equipos.map((x) => `${x.nombre} ${x.total.puntos}`).join(' – ') : `⏳ Pendiente de jugar (${p.id.slice(-6)})`;
  const selector = `<div class="card row"><select id="sel">${ps.map((p, i) => `<option value="${i}" ${i === matchIdx ? 'selected' : ''}>${esc(label(p))}</option>`).join('')}</select>
    <button class="btn-del" id="del" title="Quitar este partido">🗑️</button></div>`;
  const bind = () => {
    document.getElementById('sel').onchange = (ev) => { matchIdx = +ev.target.value; teamIdx = 0; render(); };
    document.getElementById('del').onclick = () => {
      quitar(m.id, m.deEquipo && !m.manual ? 'partido (volverá a aparecer si sigues a su equipo)' : 'partido');
    };
  };
  if (!m.equipos.length) {
    app.innerHTML = selector + `<div class="card pend">⏳ Este partido aún no tiene jugada a jugada publicado por la FCBQ.<br>En cuanto empiece, las estadísticas aparecerán aquí solas (se revisa cada minuto).</div>`;
    bind();
    return;
  }
  app.innerHTML = `
    ${selector}
    <div class="card">
      <div class="score">
        <div><div class="n">${a?.total.puntos ?? 0}</div><div class="t">${esc(a?.nombre)}</div></div>
        <div class="vs">${m.periodoActual ? 'Periodo ' + esc(m.periodoActual) : 'vs'}</div>
        <div><div class="n">${b?.total.puntos ?? 0}</div><div class="t">${esc(b?.nombre ?? '')}</div></div>
      </div>
    </div>
    <div class="card">
      ${teamTabs(m.equipos.map((x) => x.nombre))}
      ${kpis(e.total)}
    </div>
    <div class="card"><h2>Jugadores · ${esc(e.nombre)}</h2>${table(e.jugadores, e.total, false)}</div>`;
  bind();
}

function renderSeason() {
  // Acumula por equipo (nombre) y jugador a lo largo de todos los partidos
  const teams = {};
  for (const m of data.partidos) for (const e of m.equipos) {
    const t = (teams[e.nombre] ??= { nombre: e.nombre, pj: 0, total: Object.fromEntries(SUM.map((k) => [k, 0])), jug: {} });
    t.pj++;
    SUM.forEach((k) => (t.total[k] += e.total[k] || 0));
    for (const p of e.jugadores) {
      const j = (t.jug[p.nombre] ??= { nombre: p.nombre, dorsal: p.dorsal, pj: 0, ...Object.fromEntries(SUM.map((k) => [k, 0])) });
      j.pj++; j.dorsal = p.dorsal || j.dorsal;
      SUM.forEach((k) => (j[k] += p[k] || 0));
    }
  }
  const list = Object.values(teams).sort((a, b) => b.pj - a.pj);
  const t = list[teamIdx] || list[0];
  if (!t) { app.innerHTML = `<div class="card pend">⏳ Todavía no hay partidos con estadísticas.</div>`; return; }
  app.innerHTML = `
    <div class="card">${teamTabs(list.map((x) => `${x.nombre} (${x.pj})`))}${kpis(t.total)}</div>
    <div class="card"><h2>Temporada · ${esc(t.nombre)} · ${t.pj} partidos</h2>${table(Object.values(t.jug), t.total, true)}</div>`;
}

function render() {
  if (!data) return;
  document.querySelectorAll('#modes button').forEach((b) => b.classList.toggle('on', b.dataset.m === mode));
  if (mode === 'equipo') { renderEquipo(); bindTabla(); return; }
  if (!data.partidos.length) {
    app.innerHTML = lista.equipos.length
      ? `<div class="card empty">🔎 Siguiendo ${lista.equipos.length === 1 ? 'a tu equipo' : 'a tus equipos'}, pero la FCBQ todavía no ha publicado partidos suyos.<br>Mientras tanto puedes añadir partidos pegando su enlace.</div>`
      : `<div class="card empty">🏀 Todavía no hay partidos.<br>Pega arriba el enlace de un partido o de tu equipo y pulsa <b>＋ Añadir</b>.<br>A partir de ahí todo se actualiza solo.</div>`;
    return;
  }
  mode === 'partido' ? renderMatch() : renderSeason();
  bindTabla();
}

function bindTabla() {
  app.querySelectorAll('#teams button').forEach((b) => (b.onclick = () => { teamIdx = +b.dataset.t; render(); }));
  app.querySelectorAll('th').forEach((th) => (th.onclick = () => {
    const k = th.dataset.k;
    sortDir = sortKey === k ? -sortDir : (k === 'nombre' || k === 'dorsal' ? 1 : -1);
    sortKey = k; render();
  }));
}

// ---------- Mi equipo: estadísticas oficiales de la FCBQ por temporada y por partido ----------
// Convierte un registro de la FCBQ (temporada o partido de un jugador) a las columnas de la tabla
const jugadorFCBQ = (x) => ({
  nombre: x.name, dorsal: x.dorsal != null ? String(x.dorsal) : '', pj: x.matchesPlayed,
  puntos: x.totalScore || 0, t1: x.sumShotsOfOneSuccessful || 0, t1i: x.sumShotsOfOneAttempted || 0,
  t2: x.sumShotsOfTwoSuccessful || 0, t3: x.sumShotsOfThreeSuccessful || 0,
  faltas: x.sumFouls || 0, rebotes: x.sumRebounds || 0, asistencias: x.sumAssists || 0,
  min: x.timePlayed || 0, val: x.sumValoration || 0,
});
const sumar = (rows) => rows.reduce((t, r) => {
  for (const k of ['puntos','t1','t1i','t2','t3','faltas','rebotes','asistencias','min','val']) t[k] = (t[k] || 0) + (r[k] || 0);
  return t;
}, {});

async function cargarEquipo(id) {
  const prev = equipos[id];
  if (prev && Date.now() - prev.t < 5 * 60e3) return prev;   // como mucho cada 5 minutos
  try {
    const d = await fcbq(`team-stats/team/${id}/season/${temporadaActual()}`);
    if (!d.team) return (equipos[id] = { t: Date.now(), vacio: true });
    const jugadores = (d.players || []).map(jugadorFCBQ);
    // Partido a partido: estadísticas de cada jugador en cada partido
    const partidos = {};
    const sinDetalle = [];   // jugadores sin datos por partido (p. ej. nombres anonimizados por la FCBQ)
    await Promise.all((d.players || []).map(async (pl) => {
      try {
        const ps = pl.uuid ? await fcbq(`player-stats/federated/${pl.uuid}/team/${id}`) : null;
        const evs = ps?.[id]?.evolutiveStats || [];
        if (!evs.length) sinDetalle.push(pl.name);
        for (const ev of evs) {
          const m = (partidos[ev.matchCallUuid] ??= { id: ev.matchCallUuid, fecha: ev.matchDay, rival: ev.opponentTeamName, jugadores: [] });
          m.jugadores.push({ ...jugadorFCBQ(ev), pj: undefined });
        }
      } catch { sinDetalle.push(pl.name); }
    }));
    const lista = Object.values(partidos)
      .map((m) => ({ ...m, total: sumar(m.jugadores) }))
      .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
    return (equipos[id] = { t: Date.now(), info: d.team, jugadores, total: sumar(jugadores), partidos: lista, sinDetalle });
  } catch {
    return prev || { t: Date.now(), vacio: true };
  }
}

const fechaCorta = (f) => {
  const d = new Date(String(f).replace(' ', 'T'));
  return isNaN(d) ? esc(f) : d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
};

function renderEquipo() {
  if (!lista.equipos.length) {
    app.innerHTML = `<div class="card empty">👥 Pega arriba el enlace de tu equipo (…/equip/…) y pulsa <b>＋ Añadir</b>.<br>Verás sus partidos jugados y las estadísticas de la temporada.</div>`;
    return;
  }
  const eq = lista.equipos[equipoSel] || lista.equipos[0];
  const d = equipos[eq.id];
  const tabs = lista.equipos.length > 1
    ? `<div class="tabs" style="margin-bottom:12px">${lista.equipos.map((e, i) => `<button data-eqsel="${i}" class="${i === equipoSel ? 'on' : ''}">${esc(equipos[e.id]?.info?.teamName || 'Equipo ' + e.id)}</button>`).join('')}</div>` : '';
  if (!d) { app.innerHTML = `<div class="card pend">${tabs}⏳ Cargando el equipo…</div>`; return bindEq(); }
  if (d.vacio) { app.innerHTML = `<div class="card pend">${tabs}⏳ La FCBQ aún no tiene estadísticas de este equipo esta temporada.<br>Aparecerán solas después de su primer partido.</div>`; return bindEq(); }
  const i = d.info, r = i.teamResults || {}, sc = i.teamScore || {};
  const partidos = d.partidos.map((m) => {
    const abierto = partidoAbierto === m.id;
    return `<div class="card">
      <button class="partido" data-abrir="${esc(m.id)}">
        <span><b>vs ${esc(m.rival)}</b><small>${fechaCorta(m.fecha)}</small></span>
        <span class="pts">${m.total.puntos} pts ${abierto ? '▴' : '▾'}</span>
      </button>
      ${abierto ? `<div style="margin-top:12px">${kpis(m.total)}<h2 style="margin-top:14px">Jugadores</h2>${table(m.jugadores, m.total, false)}
        ${d.sinDetalle.length ? `<p class="hint">No incluye a ${esc(d.sinDetalle.join(', '))}: la FCBQ no publica sus datos partido a partido (sí en la temporada).</p>` : ''}</div>` : ''}
    </div>`;
  }).join('');
  app.innerHTML = `
    <div class="card">
      ${tabs}
      <h2 style="margin-bottom:2px">${esc(i.teamName)}</h2>
      <p class="hint" style="margin-top:0">${esc(i.categoryName || '')} · Temporada ${temporadaActual()}-${String(temporadaActual() + 1).slice(2)}</p>
      <div class="kpis">
        <div class="kpi"><b>${r.wins ?? 0}-${r.losses ?? 0}</b><small>Victorias-Derrotas</small></div>
        <div class="kpi"><b>${sc.ScoreFor ?? 0}-${sc.ScoreAgainst ?? 0}</b><small>Puntos a favor-en contra</small></div>
        <div class="kpi"><b>${i.sumMatches ?? d.partidos.length}</b><small>Partidos jugados</small></div>
      </div>
    </div>
    <h2 style="padding:0 4px">Partidos jugados</h2>
    ${partidos || '<div class="card pend">Todavía no hay partidos jugados.</div>'}
    <div class="card"><h2>Temporada · jugadores</h2>${kpis(d.total)}<div style="margin-top:12px">${table(d.jugadores, d.total, true)}</div></div>
    <p class="hint" style="padding:0 4px">Datos oficiales de la FCBQ. La FCBQ solo registra los fallos de tiros libres, por eso las canastas de 2 y los triples se muestran sin intentos.</p>`;
  bindEq();
}

function bindEq() {
  app.querySelectorAll('[data-eqsel]').forEach((b) => (b.onclick = () => { equipoSel = +b.dataset.eqsel; partidoAbierto = null; render(); }));
  app.querySelectorAll('[data-abrir]').forEach((b) => (b.onclick = () => { partidoAbierto = partidoAbierto === b.dataset.abrir ? null : b.dataset.abrir; render(); }));
}

document.querySelectorAll('#modes button').forEach((b) => (b.onclick = () => { mode = b.dataset.m; teamIdx = 0; render(); }));

function renderEquipos() {
  document.getElementById('equipos').innerHTML = lista.equipos.map((e) => {
    const n = estadoEquipo[e.id];
    const info = n == null ? 'cargando…' : n ? `${n} jugados` : 'sin partidos aún';
    const nombre = equipos[e.id]?.info?.teamName || 'Equipo ' + e.id;
    return `<span class="chip">👥 ${esc(nombre)} <small>${info}</small><button data-eq="${esc(e.id)}" title="Dejar de seguir">✕</button></span>`;
  }).join('');
  document.querySelectorAll('[data-eq]').forEach((b) => (b.onclick = () => quitar(b.dataset.eq, 'equipo')));
}

// Lee un JSON del servidor de estadísticas de la FCBQ (a través del proxy de Netlify)
async function fcbq(path) {
  const r = await fetch('/fcbq/' + path, { cache: 'no-store' });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function cargarPartido(id) {
  // Un partido terminado no cambia: si ya lo tenemos y no se ha movido en 3 h, no se vuelve a pedir
  const prev = cache[id];
  if (prev?.jugadas && Date.now() - prev.cambio > 3 * 3600e3) return prev;
  try {
    const [moves, stats] = await Promise.all([
      fcbq(`getJsonWithMatchMoves/${id}?currentSeason=true`),
      fcbq(`getJsonWithMatchStats/${id}?currentSeason=true`).catch(() => null),
    ]);
    const m = buildMatch(id, moves, stats);
    if (!m.jugadas) return { id, pendiente: true, equipos: [] };
    m.cambio = prev && prev.jugadas === m.jugadas ? prev.cambio : Date.now();
    return (cache[id] = m);
  } catch {
    return prev || { id, pendiente: true, equipos: [] };
  }
}

let refrescando = null;
async function refresh() {
  if (refrescando) return refrescando;
  refrescando = (async () => {
    renderEquipos();
    const manual = new Set(lista.partidos.map((p) => p.id));
    const deEquipo = new Set();
    await Promise.all(lista.equipos.map(async (e) => {
      const d = await cargarEquipo(e.id);
      estadoEquipo[e.id] = d.vacio ? 0 : d.partidos.length;
    }));
    renderEquipos();
    const ids = [...new Set([...manual, ...deEquipo])];
    const partidos = await Promise.all(ids.map(cargarPartido));
    partidos.forEach((p) => { p.manual = manual.has(p.id); p.deEquipo = deEquipo.has(p.id); });
    // Primero los que tienen datos (más recientes arriba), después los pendientes
    partidos.sort((a, b) => (b.jugadas ? 1 : 0) - (a.jugadas ? 1 : 0));
    const sel = data?.partidos[matchIdx]?.id;
    data = { partidos };
    const i = partidos.findIndex((p) => p.id === sel);
    matchIdx = i >= 0 ? i : 0;
    document.getElementById('upd').textContent = 'En directo desde la FCBQ · actualizado a las ' + new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    render();
  })().finally(() => (refrescando = null));
  return refrescando;
}

async function load() {
  try {
    lista = await api('GET');
    if (lista.equipos.length) mode = 'equipo';
  } catch {
    document.getElementById('upd').textContent = 'No se pudo cargar la lista de partidos';
  }
  await refresh();
}
load();
setInterval(refresh, 60000);
setInterval(async () => { try { lista = await api('GET'); } catch {} }, 5 * 60000);
</script>
